<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick's Profile Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="page">
        <article class="profile-card">

            <img src="images/profilepicture.png"
                 alt="Photo of Nick Broniec"
                 class="profile-card__avatar">

            <header class="profile-card__header">
                <h1 class="profile-card__name">Nick Broniec</h1>
                <p class="profile-card__title">Cybersecurity Student &amp; Developer</p>
            </header>

            <section class="profile-card__bio">
                <p>
                    CS student mainly focused on cybersecurity. I build tools, mod games, and occasionally break things on purpose to learn how they work.
                </p>
            </section>

            <nav class="profile-card__socials" aria-label="My Links">
                <ul>
                    <li>
                        <a href="https://github.com/ngbroniec" target="_blank" rel="noopener noreferrer" class="social-link social-link--github">
                            GitHub
                        </a>
                    </li>
                    <li>
                        <a href="https://www.neiu.edu/" target="_blank" rel="noopener noreferrer" class="social-link social-link--linkedin">
                            NEIU
                        </a>
                    </li>
                    <li>
                        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer" class="social-link social-link--twitter">
                            Twitter
                        </a>
                    </li>
                </ul>
            </nav>

        </article>
    </main>

</body>
</html>
